name: Slither Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  slither:
    name: Run Slither Static Analysis
    runs-on: ubuntu-latest
    # Thêm quyền ghi để Github hiển thị lỗi trực tiếp vào Code Scanning
    permissions:
      contents: read
      security-events: write 
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Node.js với cơ chế Cache (Giúp pipeline chạy nhanh hơn)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Sửa theo phiên bản dự án của bạn
          cache: 'npm'       # Cache lại node_modules

      # 2. Cài đặt dependencies nhanh và chuẩn xác
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi

      # 3. Chạy Slither bằng Action chính thức (Tự động quản lý Python & solc)
      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          target: '.' # Hoặc trỏ thẳng vào 'contracts/' để quét nhanh hơn
          fail-on: 'high' # Tự động fail pipeline nếu có lỗi High severity
          slither-args: '--exclude-dependencies' # Bỏ qua thư viện ngoài (vd: OpenZeppelin)
          sarif: results.sarif # Xuất ra định dạng SARIF chuẩn của GitHub

      # 4. Tải file cấu trúc lỗi lên giao diện GitHub Security
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Đảm bảo luôn upload báo cáo dù code có bị fail ở bước trên
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}

      # 5. Vẫn giữ lại file raw cho mục đích tải xuống
      - name: Upload Slither raw artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-results
          path: results.sarif
